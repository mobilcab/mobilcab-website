name: Deploy to Vercel

# Deploys through the Vercel CLI with a token, not through the native GitHub<->Vercel integration
# (same approach as mobilcab-cad). That keeps deploys from depending on who authored the git
# commit. A push to main deploys to production; Actions -> Deploy to Vercel -> Run workflow
# deploys a preview or production build on demand.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel environment to deploy to"
        type: choice
        options:
          - preview
          - production
        default: preview

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@54.14.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Verify build output
        run: test -d .vercel/output && test -f .vercel/output/config.json

      - name: Deploy prebuilt output to Vercel
        id: deploy
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ($TARGET) to $DEPLOY_URL"

      - name: Verify deployment
        timeout-minutes: 5
        run: vercel inspect "${{ steps.deploy.outputs.url }}" --wait --timeout 4m --token=${{ secrets.VERCEL_TOKEN }}
